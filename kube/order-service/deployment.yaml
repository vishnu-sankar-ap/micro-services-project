apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service

        image: 089089715847.dkr.ecr.eu-north-1.amazonaws.com/order-service:v2

        ports:
        - containerPort: 3003