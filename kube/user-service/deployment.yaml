apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
      - name: user-service

        image: 089089715847.dkr.ecr.eu-north-1.amazonaws.com/user-service:v1

        ports:
        - containerPort: 3001